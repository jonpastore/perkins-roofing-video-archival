name: deploy

# R3: git is the source of truth and there are no manual deploys. This is the only path to prod.
#
# Runs ONLY on a push to main, and only after ci.yml has gone green for that same commit — a red
# lint/SAST/coverage run therefore cannot ship. Authentication is keyless (Workload Identity
# Federation, infra/cicd.tf); no service-account JSON exists in the repo or in GitHub secrets.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # Manual re-run for a failed rollout. Still deploys the CURRENT main, never an arbitrary ref.
  workflow_dispatch:

# One deploy at a time. scripts/deploy.sh updates a Cloud Run service and six jobs; two
# concurrent runs race on the service's optimistic lock and the second ABORTs mid-way,
# leaving the jobs on a different image than the service.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # required to mint the OIDC token WIF exchanges

jobs:
  deploy:
    # workflow_run fires on failure too — only ship when ci actually passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Deploy the commit CI validated, not whatever main has drifted to since.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0        # deploy.sh tags the image with `git rev-parse --short HEAD`

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/981279422576/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ci-deployer@video-archival-and-content-gen.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # ::add-mask:: BEFORE the value is ever used, so a later failure can't echo it into logs.
      - id: cf
        name: Read the Cloudflare token for the plan
        run: |
          token="$(gcloud secrets versions access latest --secret=cloudflare-api-token)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # R4: infra must already match git before app code ships. This does NOT apply — an
      # `apply` from CI would need near-editor rights, and a plan that silently converges prod
      # to a bad commit is worse than a failed build. Exit 2 = drift, and the deploy stops.
      - name: Terraform drift gate (plan must be clean)
        working-directory: infra
        env:
          # The cloudflare provider READS the zone during plan; without a real token every CF
          # resource errors and the gate can never go green. Same source scripts/drift_check.sh
          # uses. The deployer has accessor on this ONE secret (infra/cicd.tf), nothing else.
          TF_VAR_cloudflare_api_token: ${{ steps.cf.outputs.token }}
        run: |
          terraform init -input=false
          # State LOCKING stays on. The GCS backend locks natively, and combined with the
          # deploy-prod concurrency group above it guarantees infra changes serialise.
          # -lock=false was a convenience while iterating and should never ship.
          terraform plan -input=false -detailed-exitcode && code=$? || code=$?
          if [ "$code" = "2" ]; then
            echo "::error::Terraform plan is NOT clean — infra has drifted from git (R4)."
            echo "::error::Run 'cd infra && terraform apply' deliberately, then re-run this deploy."
            exit 1
          fi
          exit "$code"

      - name: Deploy (build image, roll service + jobs)
        run: bash scripts/deploy.sh

      - name: Verify the served image is this commit
        run: |
          want="$(git rev-parse --short HEAD)"
          got="$(gcloud run services describe api --region us-central1 \
                   --format='value(spec.template.spec.containers[0].image)')"
          echo "want=$want got=$got"
          case "$got" in
            *":$want") echo "serving $want" ;;
            *) echo "::error::prod is serving '$got', expected tag '$want'"; exit 1 ;;
          esac

      # ---------------------------------------------------------------------
      # The SPA. Until 2026-08-02 this workflow never touched web/, so a merged
      # UI change was not live until someone remembered to run `firebase deploy`
      # by hand — #430 slice 4's entire interface shipped CI-green and invisible
      # for a day, and "deployed" in a commit message meant the API only.
      #
      # AFTER the API, deliberately: the SPA calls endpoints the new image
      # serves, so shipping the interface first exposes buttons that 404.
      # ---------------------------------------------------------------------
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Materialise the SPA build environment
        run: |
          gcloud secrets versions access latest --secret=spa-build-env > web/.env
          # A build with no .env SUCCEEDS and ships a bundle whose Firebase key is `undefined` —
          # every user then hits auth/invalid-api-key. Fail here, where the cause is legible.
          grep -qE '^VITE_FIREBASE_API_KEY=.+' web/.env \
            || { echo "::error::spa-build-env has no VITE_FIREBASE_API_KEY — refusing to ship a bundle that cannot authenticate"; exit 1; }

      - name: Build the SPA
        working-directory: web
        run: |
          npm ci
          # `npm run build` is `tsc -b && vite build`. NOT `tsc --noEmit`, which has passed twice
          # on code the real build rejected.
          npm run build

      - name: The built bundle must actually carry the key
        run: |
          key="$(grep -E '^VITE_FIREBASE_API_KEY=' web/.env | cut -d= -f2-)"
          grep -rqF "$key" web/dist/assets/ \
            || { echo "::error::the built bundle does not contain the Firebase key — the env did not reach vite"; exit 1; }

      - name: Deploy hosting
        working-directory: web
        # firebase.json and .firebaserc live in web/, and hosting target `app` maps to
        # public: dist -> web/dist. `setback` is a separate site with its own build and is
        # deliberately NOT deployed here. The CLI authenticates with the same WIF credentials
        # google-github-actions/auth exported (GOOGLE_APPLICATION_CREDENTIALS); no CI token.
        # Pinned to the version this path was verified against by hand on 2026-08-02, so a CLI
        # release cannot change how prod ships without someone choosing it.
        run: npx --yes firebase-tools@15.23.0 deploy --only hosting:app --project video-archival-and-content-gen --non-interactive

      # "Deploy complete!" is the CLI's claim, not evidence. Check what the site SERVES —
      # the same discipline as the image-tag check above.
      - name: Verify the SERVED bundle is the one just built
        run: |
          want="$(basename "$(ls web/dist/assets/index-*.js | head -1)")"
          got="$(curl -fsS https://video-archival-and-content-gen.web.app/ \
                   | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)"
          echo "want=$want got=$got"
          [ "$want" = "$got" ] \
            || { echo "::error::hosting is serving '$got', expected '$want'"; exit 1; }
