blockers:
  - id: EXT-GL-01
    impact: high
    status: external_access_required
    evidence: A prior automation trace exposed the GHL password. Rotation is required before any further account inspection; then read-only mapping is required before Perkins-specific IDs, fields, stages and workflow compatibility can be verified.
    owner: product owner / authorized account operator
    affected_artifacts: [docs/requirements/ghl-lifecycle-integration-trd.md]
  - id: EXT-GL-04
    impact: high
    status: external_evidence_required
    evidence: Repository discovery identifies app-native ledger and Knowify imported receivables records, but no authenticated payment-provider/account contract suitable for Won/handoff transitions.
    owner: finance owner / authorized provider operator
    affected_artifacts: [docs/requirements/ghl-lifecycle-integration-trd.md]
  - id: EXT-GL-02
    impact: high
    status: external_authorization_required
    evidence: Renewed GHL discovery requires an approved least-privilege OAuth/private-integration method, scopes, installed locations, log access and non-production webhook evidence; some of these may change external account state and are not authorized by read-only login access alone.
    owner: product owner / authorized GHL account operator
    affected_artifacts: [docs/requirements/ghl-lifecycle-integration-trd.md]
  - id: EXT-GL-05
    impact: high
    status: legal_privacy_validation_required
    evidence: The 30-day/one-year/seven-year engineering baseline is not a legal-compliance claim; legal basis, jurisdictional application, backup/restore, hold and data-subject obligations require validation before production.
    owner: legal/privacy owner
    affected_artifacts: [.devsecops-review/ghl-lifecycle-design-readiness.md]
  - id: EXT-GL-06
    impact: medium
    status: pre_production_external_configuration
    evidence: Approved contractual/legal/business policy values and notice content must be supplied before production configuration; this does not block system design.
    owner: authorized business/contractual policy owner
    affected_artifacts: [docs/requirements/ghl-lifecycle-integration-trd.md]
  - id: EXT-GL-07
    impact: high
    status: implementation_contract_evidence_required
    evidence: Remote handoff destination, authorization, acknowledgement, idempotency, retry and compensation contract is required before remote dispatch.
    owner: authorized downstream-system operator
    affected_artifacts: [docs/requirements/ghl-lifecycle-integration-trd.md]
assumptions:
